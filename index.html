<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0c141c;--sf:#141e2a;--card:#1a2836;--card2:#1f3042;
      --ac:#4fc3f7;--ac2:#81d4fa;--gn:#66bb6a;--or:#ffa726;--rd:#ef5350;
      --tx:#dfe6ed;--dm:#607888;--bd:#24343f;
    }
    body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}

    .hd{background:linear-gradient(160deg,#162636,#0e1c2c);border-bottom:1px solid var(--bd);padding:18px 16px;text-align:center;position:sticky;top:0;z-index:100}
    .hd h1{font-size:18px;font-weight:700;color:var(--ac)}
    .hd p{font-size:11px;color:var(--dm);margin-top:2px}

    /* image hints */
    .hints{margin-top:8px;padding-left:46px;display:flex;flex-wrap:wrap;gap:4px}
    .hint{font-size:10px;padding:2px 9px;border-radius:10px;background:rgba(255,167,38,.08);color:var(--or);border:1px solid rgba(255,167,38,.2)}

    .st{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);font-size:12px}
    .st span{color:var(--ac);font-weight:700}

    .act{display:flex;justify-content:center;gap:8px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd)}
    .btn{padding:8px 16px;border:none;border-radius:7px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
    .btn:disabled{opacity:.3;cursor:not-allowed}
    .btn-p{background:var(--ac);color:#0c141c}
    .btn-p:hover:not(:disabled){background:var(--ac2)}
    .btn-g{background:transparent;color:var(--dm);border:1px solid var(--bd)}
    .btn-g:hover{border-color:var(--ac);color:var(--ac)}

    .oh{padding:16px;background:linear-gradient(135deg,rgba(79,195,247,.08),transparent);border-bottom:1px solid var(--bd)}
    .ol{font-size:11px;font-weight:600;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
    .ot{font-size:15px;font-weight:700}

    .dh{padding:10px 16px;font-size:13px;font-weight:600;color:var(--ac2);background:rgba(79,195,247,.03);border-bottom:1px solid var(--bd)}

    .tc{padding:14px 16px;border-bottom:1px solid var(--bd);transition:background .1s}
    .tc:hover{background:var(--card2)}
    .th{display:flex;gap:10px;align-items:flex-start}
    .tn{flex-shrink:0;min-width:36px;height:36px;border-radius:8px;background:rgba(79,195,247,.1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ac);border:1px solid rgba(79,195,247,.15);padding:0 6px}
    .tb{flex:1;min-width:0}
    .tt{font-size:13px;line-height:1.6}
    .tm{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
    .bd{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
    .bd-ok{background:rgba(102,187,106,.12);color:var(--gn)}
    .bd-no{background:rgba(96,120,136,.12);color:var(--dm)}

    /* Gallery */
    .gl{display:flex;gap:6px;margin-top:10px;padding-left:46px;flex-wrap:wrap;align-items:flex-start}
    .gi{position:relative;border-radius:7px;overflow:hidden;border:2px solid var(--bd);cursor:pointer;flex-shrink:0;transition:border-color .15s;width:80px;height:80px}
    .gi:hover{border-color:var(--ac)}
    .gi img,.gi video{width:100%;height:100%;object-fit:cover;display:block}
    .gi .go{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;gap:4px;opacity:0;transition:opacity .15s}
    .gi:hover .go{opacity:1}
    .go button{width:26px;height:26px;border-radius:50%;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .ov-v{background:var(--ac);color:#0c141c}
    .ov-d{background:var(--rd);color:#fff}
    .vi-badge{position:absolute;bottom:3px;left:3px;background:rgba(0,0,0,.7);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;font-weight:600;pointer-events:none}
    .fi-size{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.7);color:var(--dm);font-size:8px;padding:1px 4px;border-radius:3px;pointer-events:none}

    /* Upload */
    .ur{margin-top:8px;padding-left:46px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .ul{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:6px;border:1px dashed var(--bd);background:transparent;color:var(--dm);font-family:'Sarabun',sans-serif;font-size:11px;cursor:pointer;transition:all .15s}
    .ul:hover{border-color:var(--ac);color:var(--ac)}

    /* Progress bar */
    .pg-wrap{width:100%;margin-top:6px;padding-left:46px}
    .pg-bar{width:100%;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
    .pg-fill{height:100%;background:var(--ac);border-radius:3px;transition:width .2s}
    .pg-text{font-size:10px;color:var(--dm);margin-top:2px}

    /* White School script block */
    .ws-script{margin-top:8px;padding-left:46px}
    .ws-script-inner{background:rgba(79,195,247,.04);border-left:3px solid rgba(79,195,247,.25);border-radius:0 6px 6px 0;padding:8px 12px}
    .ws-script-text{font-size:12px;color:var(--dm);line-height:1.8}

    /* Modal */
    .mb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
    .mx{position:relative;max-width:94vw;max-height:90vh;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--bd);display:flex;flex-direction:column}
    .mx img{display:block;width:auto;max-width:94vw;max-height:74vh;object-fit:contain;align-self:center}
    .mx video{display:block;max-width:94vw;max-height:74vh;background:#000}
    .mf{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--bd)}
    .mn{font-size:11px;color:var(--dm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .ms{font-size:10px;color:var(--dm);margin-left:8px;white-space:nowrap}
    .mc{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .btn-sm{padding:4px 10px;font-size:11px;border-radius:5px}
    .btn-rs{padding:4px 10px;font-size:11px;border-radius:5px;background:transparent;color:var(--rd);border:1px solid rgba(239,83,80,.3);cursor:pointer}

    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(70px);padding:9px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:999;transition:transform .25s ease;pointer-events:none;white-space:nowrap}
    .toast.show{transform:translateX(-50%) translateY(0)}
    .toast-success{background:var(--gn);color:#0c141c}
    .toast-error{background:var(--rd);color:#fff}

    .ov{position:fixed;inset:0;background:rgba(12,20,28,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
    .sp{width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .5s linear infinite}
    .ov .sp{width:30px;height:30px;border-width:3px}
    .ov p{margin-top:10px;font-size:13px;color:var(--dm)}
    @keyframes spin{to{transform:rotate(360deg)}}

    .hidden{display:none!important}

    /* ===================== MOBILE IMPROVEMENTS ===================== */
    @media (max-width: 600px) {
      /* Safe area for notch / home bar */
      body { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .hd { padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
      .toast { bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }

      /* Header — tighter on small screens */
      .hd h1 { font-size: 15px; }
      .hd p  { font-size: 10px; }

      /* Stat bar — smaller gap so it fits one line */
      .st { gap: 8px; font-size: 11px; padding: 8px 12px; }

      /* Action buttons — full-width and taller for thumbs */
      .act { flex-direction: column; gap: 6px; padding: 10px 12px; }
      .btn { width: 100%; justify-content: center; padding: 12px 16px; font-size: 14px; }

      /* Section header */
      .oh { padding: 12px; }
      .ot { font-size: 14px; }

      /* Topic row */
      .tc { padding: 12px 12px; }
      .tn { min-width: 32px; height: 32px; font-size: 11px; }
      .tt { font-size: 12px; }

      /* Gallery — bigger thumbnails, no left-indent on mobile */
      .gl { padding-left: 0; gap: 8px; margin-top: 10px; }
      .gi { width: 96px; height: 96px; border-radius: 10px; }

      /* Touch phones — small delete badge in corner; image stays visible */
      .gi .go { opacity: 1; background: none; align-items: flex-start; justify-content: flex-end; padding: 4px; }
      .ov-v { display: none; }
      .ov-d { width: 26px; height: 26px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.6); }

      /* Upload buttons — bigger tap area */
      .ur { padding-left: 0; gap: 8px; margin-top: 10px; }
      .ul { padding: 10px 16px; font-size: 13px; border-radius: 8px; flex: 1; justify-content: center; min-width: 120px; }

      /* Progress */
      .pg-wrap { padding-left: 0; }

      /* White School script */
      .ws-script { padding-left: 0; margin-top: 8px; }
      .ws-script-text { font-size: 11px; line-height: 1.7; }

      /* Image hints */
      .hints { padding-left: 0; }
      .hint { font-size: 10px; }

      /* Modal — full screen on phone */
      .mb { padding: 0; align-items: flex-end; }
      .mx {
        max-width: 100vw;
        width: 100vw;
        max-height: 92vh;
        border-radius: 16px 16px 0 0;
        border-bottom: none;
      }
      .mx img  { max-width: 100vw; max-height: 60vh; }
      .mx video{ max-width: 100vw; max-height: 60vh; }

      /* Modal footer — stack buttons vertically */
      .mf { flex-wrap: wrap; gap: 8px; padding: 12px; }
      .mn { font-size: 12px; width: 100%; }
      .ms { display: none; } /* hide size on small screens to save space */
      .btn-sm, .btn-rs { flex: 1; padding: 10px 8px; font-size: 13px; text-align: center; justify-content: center; }
      .mc { top: 10px; right: 10px; width: 36px; height: 36px; font-size: 18px; }

      /* Toast — full width */
      .toast { width: calc(100% - 32px); text-align: center; white-space: normal; font-size: 12px; }
    }

    /* ===================== TABLET / iPAD ===================== */
    /* On iPad, the whole thumbnail (.gi) is already tappable to open preview.
       So we hide the redundant 👁 view button and show only a small delete
       badge in the top-right corner — the image stays fully visible. */
    @media (min-width: 601px) and (hover: none) and (pointer: coarse) {
      .gi { width: 90px; height: 90px; }
      .gi .go {
        opacity: 1;
        background: none;          /* no dark overlay — image fully visible */
        align-items: flex-start;
        justify-content: flex-end;
        padding: 4px;
      }
      .ov-v { display: none; }     /* hide view btn — tap anywhere on image opens preview */
      .ov-d { width: 24px; height: 24px; font-size: 11px;
              box-shadow: 0 1px 4px rgba(0,0,0,.6); }
    }
  </style>
</head>
<body>

<div class="hd">
  <h1>📋 เครื่องมือนิเทศเปิดภาคเรียนที่ 1 ปี 2569</h1>
  <p>อัปโหลดรูปภาพและวิดีโอ · นิเทศเชิงรุกปลุกพลังการเรียนรู้ "เรียนดี มีคุณธรรม"</p>
</div>

<!-- Supervision Panel -->
<div id="wsPanel">
  <div class="st">
    <div>หัวข้อทั้งหมด: <span id="wsST">0</span></div>
    <div>มีไฟล์แล้ว: <span id="wsSD">0</span></div>
    <div>ไฟล์ทั้งหมด: <span id="wsSF">0</span></div>
    <div>ยังไม่มี: <span id="wsSR">0</span></div>
  </div>
  <div class="act">
    <button class="btn btn-p" id="wsBtnZ" disabled onclick="doWsZip()">📦 ดาวน์โหลด ZIP</button>
    <button class="btn btn-g" onclick="doWsRefresh()">🔄 รีเฟรช</button>
  </div>
  <div id="wsList"></div>
</div>

<!-- Shared Modal -->
<div class="mb hidden" id="modal" onclick="closeM(event)">
  <div class="mx">
    <button class="mc" onclick="closeM()">✕</button>
    <img id="mImg" class="hidden" />
    <video id="mVid" class="hidden" controls></video>
    <div class="mf">
      <div class="mn" id="mNm"></div>
      <div class="ms" id="mSz"></div>
      <div style="display:flex;gap:6px">
        <label class="btn btn-sm btn-g" style="cursor:pointer">🔄 เปลี่ยน<input type="file" accept="image/*,video/*,video/mp4,video/quicktime,video/3gpp,video/x-matroska" style="display:none" id="repIn" /></label>
        <button class="btn-rs" id="mDl">🗑 ลบ</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="ov hidden" id="ov"><div class="sp"></div><p id="ovT">กำลังดำเนินการ...</p></div>

<script>
// ===================== SUPERVISION CHECKLIST DATA =====================
var WS_TOPICS=[
  // ด้านที่ 1 การบริหารจัดการ
  {id:"s1-1",num:"1.1",title:"มีการวางแผนการดำเนินงานตามนโยบาย สพฐ. \"เรียนดี มีคุณธรรม\" และจุดเน้นของ สพป.ร้อยเอ็ด เขต 2 ROIET2 Plus Model \"งานสำเร็จผล คนมีความสุข ทุกคนปลอดภัย\""},
  {id:"s1-2",num:"1.2",title:"มีการประสานเครือข่ายและสร้างความร่วมมือกับคณะกรรมการสถานศึกษาและหน่วยงานที่เกี่ยวข้องในการวางแผนการพัฒนาคุณภาพการศึกษาก่อนเปิดภาคเรียน"},
  {id:"s1-3",num:"1.3",title:"มีวิธีการตรวจสอบข้อมูล ทร.14 เพื่อคัดกรองและติดตามเด็กที่ยังไม่มาสมัครเรียนให้เข้าสู่ระบบการศึกษาได้อย่างครบถ้วน"},
  {id:"s1-4",num:"1.4",title:"มีการจัดประชุมครูและบุคลากรเพื่อวางแผนการพัฒนาและจัดทำปฏิทินดำเนินงานของสถานศึกษาเพื่อเตรียมความพร้อมก่อนเปิดภาคเรียนที่ 1 ปีการศึกษา 2569"},
  {id:"s1-5",num:"1.5",title:"มีคำสั่งการจัดชั้นเรียน ดำเนินงานธุรการและสารสนเทศของโรงเรียนเป็นปัจจุบันและมอบหมายงานให้ครูรับผิดชอบที่ชัดเจน"},
  {id:"s1-6",num:"1.6",title:"กรณีโรงเรียนที่มีนักเรียนเรียนรวม มีการเตรียมความพร้อมในการจัดการศึกษาแบบเรียนรวม (ตามความพิการทั้ง 9 ประเภท)"},
  {id:"s1-7",num:"1.7",title:"โรงเรียนได้รับงบประมาณอาหารกลางวันจากองค์การบริหารส่วนตำบล/เทศบาล/องค์กรปกครองส่วนท้องถิ่นทันเปิดภาคเรียนที่ 1/2569"},
  {id:"s1-8",num:"1.8",title:"โรงเรียนได้จัดทำโปรแกรม Thai School Lunch (โปรแกรมอาหารกลางวัน สพฐ.)"},
  {id:"s1-9",num:"1.9",title:"โรงเรียนได้รับอาหารเสริมนมจากองค์การบริหารส่วนตำบล/เทศบาล/องค์กรปกครองส่วนท้องถิ่นทันเปิดภาคเรียนที่ 1/2569"},
  {id:"s1-10",num:"1.10",title:"มีการจัดระบบความปลอดภัย มีแผนเผชิญเหตุและบุคลากรทุกคนรับทราบร่วมกัน"},
  // ด้านที่ 2 การจัดการเรียนการสอน — ระดับปฐมวัย
  {id:"s2-1",num:"2.1.1",title:"มีหลักสูตรสถานศึกษาปฐมวัย ตามหลักสูตรการศึกษาปฐมวัย ฉบับพุทธศักราช 2560 และพุทธศักราช 2568"},
  {id:"s2-2",num:"2.1.2",title:"ครูมีการวางแผน/มีแผนการจัดประสบการณ์และจัดเตรียมสื่อการสอนตามแต่ละหน่วย"},
  {id:"s2-3",num:"2.1.3",title:"การจัดกิจกรรมในห้องเรียนเน้นมาตรการความปลอดภัยให้กับเด็ก"},
  {id:"s2-4",num:"2.1.4",title:"สภาพแวดล้อมในห้องเรียน สะอาด มีมุมประสบการณ์เอื้อต่อการเรียนรู้"},
  {id:"s2-5",num:"2.1.5",title:"สภาพแวดล้อมนอกห้องเรียนปลอดภัย ได้แก่ สนามเด็กเล่น พื้นที่เล่นกลางแจ้งที่มีร่มเงา มีที่ล้างมือ ที่รับประทานอาหาร"},
  {id:"s2-6",num:"2.1.6",title:"มีห้องน้ำสำหรับเด็กปฐมวัยที่สะอาด สะดวก และเหมาะสมกับวัย ปลอดภัย ไม่ลับตา ไม่มีน้ำขัง"},
  // ด้านที่ 2 การจัดการเรียนการสอน — ระดับการศึกษาขั้นพื้นฐาน
  {id:"s2-7",num:"2.2.1",title:"มีหลักสูตรสถานศึกษา ตามหลักสูตรแกนกลางการศึกษาขั้นพื้นฐาน พุทธศักราช 2551 และพุทธศักราช 2568"},
  {id:"s2-8",num:"2.2.2",title:"มีการเตรียมความพร้อมในการจัดการเรียนรู้โดยการออกแบบหน่วยการเรียนรู้สอดคล้องกับมาตรฐานและตัวชี้วัดตามหลักสูตรแกนกลางกำหนด"},
  {id:"s2-9",num:"2.2.3",title:"มีตารางการจัดการเรียนการสอน จัดทำเอกสารธุรการชั้นเรียน เป็นปัจจุบัน"},
  {id:"s2-10",num:"2.2.4",title:"มีการวางแผนการใช้กระบวนการ Active Learning หรือนวัตกรรมในการจัดการเรียนรู้"},
  {id:"s2-11",num:"2.2.5",title:"โรงเรียนที่ใช้การศึกษาทางไกลผ่านดาวเทียม (DLTV) หรือการจัดการเรียนรู้ผ่านเทคโนโลยีสารสนเทศ (DLIT) อุปกรณ์การรับชมใช้งานได้ดีและได้รับการดูแลรักษาให้พร้อมใช้งาน"},

// ===================== SHARED UPLOAD HELPERS =====================
var CHUNK_BYTES = 25 * 1024 * 1024; // 25 MB per chunk — base64 inflates to ~33 MB, safe under Apps Script's ~50 MB RPC limit
var LARGE_FILE_THRESHOLD = 20 * 1024 * 1024; // files > 20 MB use chunked path
var CHUNK_CONCURRENCY = 6; // google.script.run allows up to 10 concurrent; 6 leaves headroom

// Extension → safe MIME type map for phone-captured videos.
// Fixes: (1) file.type="" on Android Chrome 14/15, (2) video/quicktime MOV files,
// (3) .hevc/.heic files that browsers mis-report.
var EXT_MIME = {
  'mp4':  'video/mp4',
  'm4v':  'video/mp4',
  'mov':  'video/mp4',   // QuickTime container — normalize to mp4 for Drive compatibility
  'qt':   'video/mp4',
  'hevc': 'video/mp4',
  '3gp':  'video/3gpp',
  '3g2':  'video/3gpp2',
  'webm': 'video/webm',
  'mkv':  'video/x-matroska',
  'avi':  'video/x-msvideo',
  'wmv':  'video/x-ms-wmv',
  'flv':  'video/x-flv',
  // images
  'jpg':  'image/jpeg',
  'jpeg': 'image/jpeg',
  'png':  'image/png',
  'gif':  'image/gif',
  'webp': 'image/webp',
  'heic': 'image/heic',
  'heif': 'image/heif',
  'bmp':  'image/bmp',
  'tif':  'image/tiff',
  'tiff': 'image/tiff',
};

// Resolve the true MIME type from file.type + filename extension.
// Handles empty file.type (Android bug), video/quicktime (MOV), etc.
function resolveMime(file) {
  var ext = file.name.split('.').pop().toLowerCase();
  // 1. If browser gave us a usable type that isn't a known problem, use it
  var t = file.type || '';
  // video/quicktime = MOV — normalize to mp4 so Drive processes it correctly
  if (t === 'video/quicktime' || t === 'video/mov') t = 'video/mp4';
  // If type is empty or generic, look up by extension
  if (!t || t === 'application/octet-stream') {
    t = EXT_MIME[ext] || 'application/octet-stream';
  }
  return t;
}

// อัปโหลดไฟล์เดียว — เลือกเส้นทางตามขนาด
function uploadOneFile(file, extraFields, onDone, onFail, onProgress) {
  var mime = resolveMime(file);
  if (file.size > LARGE_FILE_THRESHOLD) {
    uploadOneFileChunked(file, mime, extraFields, onDone, onFail, onProgress);
  } else {
    var reader = new FileReader();
    reader.onload = function(e) {
      // Replace whatever MIME the browser put in the data URL with the resolved one
      var dataUrl = e.target.result.replace(/^data:[^;]+/, 'data:' + mime);
      var fd = Object.assign({fileName:file.name, mimeType:mime, dataUrl:dataUrl}, extraFields);
      var fn = extraFields.sectionId ? 'uploadWsFile' : 'uploadFile';
      google.script.run
        .withSuccessHandler(function(r){ if(r&&r.success) onDone(r); else onFail(r&&r.error); })
        .withFailureHandler(function(e){ onFail(e); })
        [fn](fd);
    };
    reader.onerror = function(){ onFail('FileReader error'); };
    reader.readAsDataURL(file);
  }
}

// อัปโหลดแบบ chunked สำหรับไฟล์ใหญ่ — parallel worker pool (ใช้ DriveApp ล้วน)
// ส่ง CHUNK_CONCURRENCY chunks พร้อมกัน เพื่อลด idle time ระหว่างรอ server response
function uploadOneFileChunked(file, mime, extraFields, onDone, onFail, onProgress) {
  var totalChunks = Math.max(1, Math.ceil(file.size / CHUNK_BYTES));
  var startData = Object.assign({fileName:file.name, mimeType:mime, totalChunks:totalChunks}, extraFields);

  google.script.run
    .withSuccessHandler(function(init) {
      if (!init || !init.success) { onFail(init&&init.error); return; }

      var sessionId = init.sessionId;
      var nextIndex = 0;
      var inFlight = 0;
      var completedBytes = 0;
      var failed = false;
      var done = false;

      function chunkOffsets(idx) {
        var off = idx * CHUNK_BYTES;
        var end = Math.min(off + CHUNK_BYTES, file.size);
        return { off: off, end: end };
      }

      function launch() {
        if (failed || done) return;
        while (inFlight < CHUNK_CONCURRENCY && nextIndex < totalChunks) {
          var idx = nextIndex++;
          inFlight++;
          sendOneChunk(idx);
        }
      }

      function sendOneChunk(idx) {
        var r = chunkOffsets(idx);
        var slice = file.slice(r.off, r.end);
        var thisSize = r.end - r.off;
        var reader = new FileReader();
        reader.onload = function(e) {
          if (failed) { inFlight--; return; }
          var raw = e.target.result;
          var b64 = raw.indexOf(',') !== -1 ? raw.split(',')[1] : raw;
          var data = {
            sessionId: sessionId,
            chunk: b64,
            chunkIndex: idx,
            mimeType: mime
          };
          google.script.run
            .withSuccessHandler(function(resp) {
              inFlight--;
              if (failed || done) return;
              if (!resp || !resp.success) {
                failed = true;
                onFail(resp && resp.error);
                return;
              }
              completedBytes += thisSize;
              if (onProgress) onProgress(completedBytes, file.size);
              if (resp.complete) {
                done = true;
                onDone(resp);
                return;
              }
              launch();
            })
            .withFailureHandler(function(err){
              inFlight--;
              if (failed || done) return;
              failed = true;
              onFail(err);
            })
            .uploadChunk(data);
        };
        reader.onerror = function() {
          inFlight--;
          if (failed || done) return;
          failed = true;
          onFail('FileReader chunk error at index ' + idx);
        };
        reader.readAsDataURL(slice);
      }

      launch();
    })
    .withFailureHandler(function(e){ onFail(e); })
    .startChunkedUpload(startData);
}

// Throttle progress UI repaints — full render() is expensive with parallel chunks
var PROGRESS_THROTTLE_MS = 250;
function makeProgressThrottle(renderFn) {
  var last = 0;
  return function(){
    var now = Date.now();
    if (now - last < PROGRESS_THROTTLE_MS) return;
    last = now;
    renderFn();
  };
}

// ===================== UPLOAD =====================
function doWsUp(input,sid){
  var files=Array.from(input.files);
  if(!files.length)return;
  var total=files.length,done=0;
  wsUploadProgress[sid]={current:0,total:total,percent:0};
  renderWs();
  toast('อัปโหลด '+total+' ไฟล์...','success');
  var throttledRenderWs = makeProgressThrottle(renderWs);
  files.forEach(function(file){
    uploadOneFile(
      file,
      {sectionId:sid},
      function(r){
        done++;
        if(!wsMap[sid])wsMap[sid]=[];
        wsMap[sid].push({fileId:r.fileId,fileName:r.fileName,isVideo:r.isVideo,mimeType:r.mimeType,thumbnail:r.thumbnail,previewUrl:r.previewUrl,sizeText:r.sizeText||''});
        wsUploadProgress[sid]={current:done,total:total,percent:Math.round(done/total*100)};
        if(done===total){delete wsUploadProgress[sid];toast('อัปโหลดเสร็จ','success');}
        renderWs();
      },
      function(err){
        done++;
        wsUploadProgress[sid]={current:done,total:total,percent:Math.round(done/total*100)};
        var msg='อัปโหลดไม่สำเร็จ: '+(err?String(err).substring(0,120):'unknown');
        if(done===total){delete wsUploadProgress[sid];}
        toast(msg,'error');
        console.error('[WS upload error]',err);
        renderWs();
      },
      function(sent,total_bytes){
        wsUploadProgress[sid]={current:done,total:total,percent:Math.round(sent/total_bytes*100),chunkMode:true};
        throttledRenderWs();
      }
    );
  });
  input.value='';
}

// ===================== DELETE =====================
function doDelWs(sid,idx){
  var fs=wsMap[sid];if(!fs||!fs[idx])return;
  if(!confirm('ลบไฟล์นี้?'))return;
  var fid=fs[idx].fileId;
  google.script.run
    .withSuccessHandler(function(r){
      if(r.success){wsMap[sid].splice(idx,1);if(curP&&curP.fileId===fid)closeM();toast('ลบสำเร็จ','success');}
      else toast('ลบล้มเหลว','error');
      renderWs();
    })
    .withFailureHandler(function(){toast('เกิดข้อผิดพลาด','error')})
    .deleteFile(fid);
}

// ===================== MODAL =====================
function openM(mode,id,idx){
  var fs=wsMap[id];if(!fs||!fs[idx])return;
  var f=fs[idx];
  curP={mode:mode,id:id,idx:idx,fileId:f.fileId,fileName:f.fileName,isVideo:f.isVideo};
  var imgEl=document.getElementById('mImg');
  var vidEl=document.getElementById('mVid');
  if(f.isVideo){imgEl.classList.add('hidden');vidEl.classList.remove('hidden');vidEl.src=f.previewUrl||'';}
  else{
    vidEl.classList.add('hidden');vidEl.src='';
    imgEl.classList.remove('hidden');
    // Use the real file URL so the full-resolution image is shown in the preview,
    // not the low-quality thumbnail served by the /thumbnail endpoint.
    imgEl.src='https://drive.google.com/uc?export=view&id='+f.fileId;
    // Fallback: if the direct URL fails (e.g. large-file virus-scan redirect),
    // fall back to a high-res thumbnail so something is always displayed.
    imgEl.onerror=function(){imgEl.onerror=null;imgEl.src=f.thumbnail.replace('sz=w400','sz=w2000');};
  }
  document.getElementById('mNm').textContent=f.fileName;
  document.getElementById('mSz').textContent=f.sizeText||'';
  document.getElementById('mDl').onclick=function(){doDelWs(id,idx);};
  document.getElementById('repIn').onchange=function(){doReplace(this);};
  document.getElementById('modal').classList.remove('hidden');
}
function closeM(e){
  if(e&&e.target!==document.getElementById('modal'))return;
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('mVid').src='';
  curP=null;
}

// ===================== REPLACE =====================
function doReplace(input){
  var file=input.files[0];if(!file||!curP)return;
  var cp=curP;
  toast('กำลังเปลี่ยนไฟล์...','success');
  var extraFields={oldFileId:cp.fileId,sectionId:cp.id};

  google.script.run
    .withSuccessHandler(function(){
      uploadOneFile(
        file,
        extraFields,
        function(r){
          var fs=wsMap[cp.id];
          if(fs&&fs[cp.idx])fs[cp.idx]={fileId:r.fileId,fileName:r.fileName,isVideo:r.isVideo,mimeType:r.mimeType,thumbnail:r.thumbnail,previewUrl:r.previewUrl,sizeText:r.sizeText||''};
          curP.fileId=r.fileId;curP.fileName=r.fileName;curP.isVideo=r.isVideo;
          openM(cp.mode,cp.id,cp.idx);
          renderWs();
          toast('เปลี่ยนสำเร็จ','success');
        },
        function(){toast('อัปโหลดไฟล์ใหม่ล้มเหลว','error');}
      );
    })
    .withFailureHandler(function(){toast('เกิดข้อผิดพลาด','error')})
    .deleteFile(cp.fileId);
  input.value='';
}

// ===================== REFRESH =====================
function doWsRefresh(){
  showOv('กำลังโหลดข้อมูล...');
  google.script.run
    .withSuccessHandler(function(files){
      wsMap={};
      files.forEach(function(f){
        var sid=f.sectionId;if(!sid)return;
        if(!wsMap[sid])wsMap[sid]=[];
        wsMap[sid].push({fileId:f.id,fileName:f.name,isVideo:f.isVideo,mimeType:f.mimeType,thumbnail:f.thumbnail,previewUrl:f.previewUrl,sizeText:f.sizeText||''});
      });
      renderWs();hideOv();
    })
    .withFailureHandler(function(){hideOv();toast('โหลดข้อมูลล้มเหลว','error')})
    .getWsFiles();
}

// ===================== ZIP =====================
function doWsZip(){
  showOv('กำลังสร้าง ZIP...');
  google.script.run
    .withSuccessHandler(function(r){hideOv();if(r.success){toast('สร้าง ZIP สำเร็จ!','success');window.open(r.downloadUrl,'_blank')}else toast('ล้มเหลว: '+r.error,'error');})
    .withFailureHandler(function(){hideOv();toast('เกิดข้อผิดพลาด','error')})
    .createWsZip();
}

// ===================== UTILS =====================
function toast(m,t){var el=document.getElementById('toast');el.textContent=m;el.className='toast toast-'+t+' show';clearTimeout(window._tt);window._tt=setTimeout(function(){el.className='toast'},3000)}
function showOv(t){document.getElementById('ovT').textContent=t;document.getElementById('ov').classList.remove('hidden')}
function hideOv(){document.getElementById('ov').classList.add('hidden')}
</script>
